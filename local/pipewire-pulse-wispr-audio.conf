# Drop-in for the user unit pipewire-pulse.service.
# Install: ~/.config/systemd/user/pipewire-pulse.service.d/wispr-audio.conf
#
# Wispr Flow's Chromium audio process keeps its old PulseAudio connection when
# the audio server restarts (this machine restarts it after every resume), and
# the microphone then fails with MicNotFound. Ending that one subprocess makes
# Flow start a fresh one on the next dictation. The leading "-" means a miss
# (Flow not running) never fails the audio server.
[Service]
ExecStartPost=-/usr/bin/pkill -f "wispr-flow --type=utility.*audio\\.mojom\\.AudioService"
